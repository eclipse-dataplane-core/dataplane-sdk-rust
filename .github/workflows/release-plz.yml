name: Release

on:
  workflow_dispatch:
    inputs:
      command:
        description: "release-plz command to run"
        required: true
        default: release-pr
        type: choice
        options:
          - release-pr
          - release

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate: mirrors ci.yml. Because the release PR only adds version/changelog changes,
  # this covers the PR content even though GITHUB_TOKEN can't auto-trigger ci.yml on it.
  test:
    name: Check, Lint, and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

  release-plz:
    name: release-plz (${{ inputs.command }})
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release-plz needs full history for changelog/tags

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_API_TOKEN }}
